name: Push to Dev

on:
  push:
    branches: [ dev ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: timelime-dev
      GCP_EMAIL: main-641@timelime-dev.iam.gserviceaccount.com
      GCP_PROJECT_NUMBER: 82528465111
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Login
      uses: google-github-actions/setup-gcloud@v0
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
        service_account_email: ${{ env.GCP_EMAIL }}
        service_account_key: ${{ secrets.GCP_CREDENTIALS_PREPROD }}

    - name: Configure Docker
      run: gcloud auth configure-docker europe-west2-docker.pkg.dev

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Build Docker image
      run: docker build . -t timelime-backend-img

    - name: Tag Docker image
      run: docker tag timelime-backend-img:latest europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest

    - name: Push image
      run: docker push europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest

    - name: Deploy to Cloud Run
      run: gcloud run deploy timelime-backend --image europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest --port 5000 --region europe-west2 --set-env-vars GCP_PROJECT_NUMBER=${{env.GCP_PROJECT_NUMBER}}


    - name: Deploy endpoint config
      run: gcloud endpoints services deploy openapi-run.yaml --project ${{ env.GCP_PROJECT_ID }}

    - name: Run Python script
      run: |
        python deploy-gateway.py

    - name: Read generated ID from file
      id: read-id
      run: echo "GENERATED_ID=$(cat config-id.txt)" >> $GITHUB_ENV

    - name: chmod
      run: chmod +x gcloud_build_image.sh

    - name: Deploy ESPV2 image
      run: ./gcloud_build_image.sh -s gateway-uavkhjofda-nw.a.run.app -c ${{ env.GENERATED_ID }} -p ${{ env.GCP_PROJECT_ID }}

    - name: Deploy ESPV2 service
      run: gcloud run deploy gateway --image="gcr.io/${{ env.GCP_PROJECT_ID }}/endpoints-runtime-serverless:2.45.0-gateway-uavkhjofda-nw.a.run.app-${{ env.GENERATED_ID }}" --allow-unauthenticated --region europe-west2 --platform managed --project=${{ env.GCP_PROJECT_ID }} --service-account ${{env.GCP_EMAIL}}