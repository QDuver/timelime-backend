name: Push to Dev

on:
  push:
    branches: [ dev ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: timelime-dev
      GCP_EMAIL: main-641@timelime-dev.iam.gserviceaccount.com
      GCP_PROJECT_NUMBER: 82528465111,
      BUCKET: timelime-dev-bucket,
      FE_URL: https://timelime-frontend-uavkhjofda-nw.a.run.app
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Login
      uses: google-github-actions/setup-gcloud@v0
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
        service_account_email: ${{ env.GCP_EMAIL }}
        service_account_key: ${{ secrets.GCP_CREDENTIALS_PREPROD }}

    - name: Apply Database Migrations
      run: python migrations/run.py

    - name: Configure Docker
      run: gcloud auth configure-docker europe-west2-docker.pkg.dev

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Build Docker image
      run: docker build . -t timelime-backend-img

    - name: Tag Docker image
      run: docker tag timelime-backend-img:latest europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest

    - name: Push image
      run: docker push europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest

    - name: Deploy to Cloud Run
      run: gcloud run deploy timelime-backend --image europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest --allow-unauthenticated --port 5000 --region europe-west2 \
      --set-env-vars FE_URL=${{env.FE_URL}} --set-env-vars BUCKET=${{env.BUCKET}} \
      --set-env-vars GCP_CREDENTIALS=${{secrets.GCP_CREDENTIALS_PREPROD}} \
      --set-env-vars STRIPE=${{secrets.STRIPE_PREPROD}} --set-env-vars STRIPE_WEBHOOK=${{secrets.STRIPE_WEBHOOK_PREPROD}}


    - name: Deploy Clean Schedule Cloud Function
      run: gcloud functions deploy clean-schedule --runtime python38 --region europe-west2 --source clean_schedule --trigger-http