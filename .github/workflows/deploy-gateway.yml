name: Push to Dev

on:
  push:
    branches: [ dev ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Run script and save output
      id: vars
      run: echo "::set-output name=CONFIG_ID::$(python deploy-gateway.py)"

    - name: Use the output
      run: echo "The number is ${{ steps.vars.outputs.CONFIG_ID }}"