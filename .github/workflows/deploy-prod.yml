name: Push to Prod

on:
  push:
    branches: [ main ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: timelime-prod
      GCP_EMAIL: main-219@timelime-prod.iam.gserviceaccount.com
      GCP_PROJECT_NUMBER: 260031091728
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Login
      uses: google-github-actions/setup-gcloud@v0
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
        service_account_email: ${{ env.GCP_EMAIL }}
        service_account_key: ${{ secrets.GCP_CREDENTIALS_PROD }}

    - name: Configure Docker
      run: gcloud auth configure-docker europe-west2-docker.pkg.dev

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Build Docker image
      run: docker build . -t timelime-backend-img

    - name: Tag Docker image
      run: docker tag timelime-backend-img:latest europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest

    - name: Push image
      run: docker push europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest

    - name: Deploy to Cloud Run
      run: gcloud run deploy timelime-backend --image europe-west2-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/timelime-backend/timelime-backend-img:latest --port 5000 --allow-unauthenticated --region europe-west2 --set-env-vars GCP_PROJECT_NUMBER=${{env.GCP_PROJECT_NUMBER}}

    - name: Deploy Clean Schedule Cloud Function
      run: gcloud functions deploy clean-schedule --runtime python38 --region europe-west2 --source clean_schedule --trigger-http --set-env-vars GCP_PROJECT_NUMBER=${{env.GCP_PROJECT_NUMBER}}